server:
  port: 8761

spring:
  application:
    name: eureka-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://config-service:8888}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  instance:
    hostname: eureka-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true